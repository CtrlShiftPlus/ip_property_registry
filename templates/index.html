<!DOCTYPE html>
<html>
<head>
    <title>IP Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --border: #1e2330;
            --accent: #c8a96e;
            --accent2: #7eb8c9;
            --text: #e8e4dc;
            --muted: #6b7080;
            --glow: rgba(200, 169, 110, 0.15);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Atmospheric background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 30%, rgba(126, 184, 201, 0.06) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 80% 70%, rgba(200, 169, 110, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Grid overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(200,169,110,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,169,110,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 80px;
            max-width: 560px;
            width: 90%;
        }

        .emblem {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border: 1px solid var(--accent);
            transform: rotate(45deg);
            margin-bottom: 40px;
            position: relative;
            animation: pulse 4s ease-in-out infinite;
        }

        .emblem::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(200,169,110,0.3);
        }

        .emblem-inner {
            transform: rotate(-45deg);
            font-size: 22px;
            color: var(--accent);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
            50% { box-shadow: 0 0 30px 4px rgba(200,169,110,0.15); }
        }

        .eyebrow {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            letter-spacing: 0.35em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.2s forwards;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 52px;
            line-height: 1.05;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.4s forwards;
        }

        h1 span {
            color: var(--accent);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px auto;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.6s forwards;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .divider-dot {
            width: 4px;
            height: 4px;
            background: var(--accent);
            transform: rotate(45deg);
        }

        .tagline {
            font-size: 13px;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 52px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.7s forwards;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.9s forwards;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 14px 28px;
            border: 1px solid var(--border);
            background: var(--surface);
            position: relative;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--glow);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 24px rgba(200,169,110,0.12);
        }

        .nav-links a:hover::before { opacity: 1; }

        .nav-links a .arrow {
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .nav-links a:hover .arrow { transform: translateX(4px); }

        /* Corner decorations */
        .corner {
            position: fixed;
            width: 40px;
            height: 40px;
        }
        .corner--tl { top: 24px; left: 24px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
        .corner--tr { top: 24px; right: 24px; border-top: 1px solid var(--border); border-right: 1px solid var(--border); }
        .corner--bl { bottom: 24px; left: 24px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); }
        .corner--br { bottom: 24px; right: 24px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div class="container">
    <div class="emblem"><span class="emblem-inner">⟡</span></div>
    <p class="eyebrow">Blockchain Verified</p>
    <h1>Intellectual<br><span>Property</span> Registry</h1>
    <div class="divider"><div class="divider-dot"></div></div>
    <p class="tagline">Secure · Immutable · Decentralized</p>

    <nav class="nav-links">
        <a href="/register">
            <span>Register Property</span>
            <span class="arrow">→</span>
        </a>
        <a href="/search">
            <span>Search Property</span>
            <span class="arrow">→</span>
        </a>
    </nav>
</div>

</body>
</html>
