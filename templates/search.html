<!DOCTYPE html>
<html>
<head>
    <title>Search Property</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --surface2: #161a22;
            --border: #1e2330;
            --accent: #c8a96e;
            --accent2: #7eb8c9;
            --text: #e8e4dc;
            --muted: #6b7080;
            --glow: rgba(200, 169, 110, 0.12);
            --result-bg: #0d1117;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 80% 20%, rgba(126, 184, 201, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 55% 55% at 15% 75%, rgba(200, 169, 110, 0.07) 0%, transparent 60%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(200,169,110,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,169,110,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 580px;
            padding: 48px 52px;
            animation: fadeIn 0.6s ease forwards;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent2), transparent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            letter-spacing: 0.3em;
            color: var(--accent2);
            text-transform: uppercase;
            margin-bottom: 16px;
            padding: 6px 14px;
            border: 1px solid rgba(126,184,201,0.25);
            background: rgba(126,184,201,0.05);
        }

        .header-badge::before {
            content: '◎';
            font-size: 10px;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 38px;
            letter-spacing: -0.01em;
            line-height: 1.1;
            color: var(--text);
        }

        h2 span { color: var(--accent2); }

        .search-form-group {
            display: flex;
            gap: 0;
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .input-wrapper {
            flex: 1;
        }

        input[type="number"] {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-right: none;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 500;
            padding: 14px 16px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            letter-spacing: 0.08em;
        }

        input[type="number"]:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(126,184,201,0.08);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        .search-btn-wrap {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        button[type="submit"] {
            padding: 14px 24px;
            background: transparent;
            border: 1px solid var(--accent2);
            color: var(--accent2);
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
            white-space: nowrap;
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent2);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        button[type="submit"]:hover::before { transform: scaleX(1); }
        button[type="submit"]:hover {
            color: var(--bg);
            box-shadow: 0 0 24px rgba(126,184,201,0.2);
        }

        button[type="submit"] span {
            position: relative;
            z-index: 1;
        }

        /* Result block */
        {% if result %}
        .result-block {
            animation: resultReveal 0.5s ease 0.1s both;
        }
        @keyframes resultReveal {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        {% endif %}

        .result-block {
            margin-top: 36px;
            border: 1px solid var(--border);
            background: var(--result-bg);
            position: relative;
        }

        .result-block::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent2), transparent);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
        }

        .result-dot {
            width: 6px;
            height: 6px;
            background: var(--accent2);
            border-radius: 50%;
            animation: blink 2s ease infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .result-label {
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent2);
            font-weight: 600;
        }

        pre {
            padding: 20px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.02em;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 32px 0 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: var(--accent); }

        /* Corner decorations */
        .corner {
            position: fixed;
            width: 36px;
            height: 36px;
        }
        .corner--tl { top: 20px; left: 20px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
        .corner--tr { top: 20px; right: 20px; border-top: 1px solid var(--border); border-right: 1px solid var(--border); }
        .corner--bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); }
        .corner--br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div class="card">
    <div class="header">
        <div class="header-badge">Ledger Lookup</div>
        <h2>Search <span>Registered</span><br>Property</h2>
    </div>

    <form method="POST">

        <label>Enter Property ID</label>
        <div class="search-form-group">
            <div class="input-wrapper">
                <input type="number" name="ip_id" required>
            </div>
            <div class="search-btn-wrap">
                <button type="submit"><span>◎ Search</span></button>
            </div>
        </div>

    </form>

    {% if result %}
    <div class="result-block">
        <div class="result-header">
            <span class="result-dot"></span>
            <span class="result-label">Record Found</span>
        </div>
        <pre>{{ result }}</pre>
    </div>
    {% endif %}

    <div class="divider"></div>
    <a href="/" class="back-link">← Back Home</a>
</div>

</body>
</html>
