<!DOCTYPE html>
<html>
<head>
    <title>Register Property</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Freighter API -->
    <script src="https://unpkg.com/@stellar/freighter-api/dist/index.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --surface2: #161a22;
            --border: #1e2330;
            --accent: #c8a96e;
            --accent2: #7eb8c9;
            --text: #e8e4dc;
            --muted: #6b7080;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 580px;
            padding: 48px;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            font-size: 11px;
            color: var(--muted);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
        }

        button {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: var(--accent);
            color: black;
        }

        .connect-btn {
            border-color: var(--accent2);
            color: var(--accent2);
        }

        .status {
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .status.success {
            color: #7eb8c9;
        }

        .status.error {
            color: #e07070;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Register Intellectual Property</h2>

    <!-- Connect Wallet -->
    <button type="button" class="connect-btn" onclick="connectWallet()">
        Connect Freighter Wallet
    </button>

    <div id="status" class="status"></div>

    <form id="ipForm" action="/register_ip" method="POST">

        <div class="form-group">
            <label>Title</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="desc" name="description" required></textarea>
        </div>

        <div class="form-group">
            <label>Wallet Address</label>
            <input type="text" id="wallet" name="wallet" required>
        </div>

        <button type="button" onclick="registerIP()">
            Register on Blockchain
        </button>

    </form>
</div>

<script>
async function connectWallet() {
    const status = document.getElementById("status");

    try {
        if (!window.freighterApi) {
            status.className = "status error";
            status.innerText =
`
Install Freighter Wallet for smooth Registration!
Steps to fix:
1. Install Freighter Wallet from Chrome Web Store
2. Open the extension
3. Create or import a wallet
4. Copy your Public Key (starts with G...)
5. Refresh this page and try again`;

            return;
        }

        const access = await window.freighterApi.requestAccess();

        if (access.error) {
            status.className = "status error";
            status.innerText =
`❌ Permission denied

Click "Connect Wallet" again and approve access in Freighter.`;
            return;
        }

        const address = await window.freighterApi.getPublicKey();

        document.getElementById("wallet").value = address;

        status.className = "status success";
        status.innerText =
`✅ Connected!

Your Wallet Address:
${address}`;

    } catch (err) {
        console.error(err);
        status.className = "status error";
        status.innerText = "Error connecting wallet.";
    }
}

async function registerIP() {
    const wallet = document.getElementById("wallet").value;

    if (!wallet) {
        alert("Please connect your Freighter wallet first");
        return;
    }

    document.getElementById("ipForm").submit();
}
</script>

</body>
</html>
